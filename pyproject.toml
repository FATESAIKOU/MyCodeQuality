[project]
name = "qmetrics"
version = "0.4.2"
description = "Deterministic static quality metrics for a git diff (stdlib only, no LLM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qmetrics = "qmetrics.cli:main"
taskquality = "taskquality.cli:main"
mcq-report = "mcqreport.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = ["qmetrics", "taskquality", "mcqreport"]
