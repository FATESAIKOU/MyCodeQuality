name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install actionlint (pinned, checksum verified)
        # Release v1.7.12 of https://github.com/rhysd/actionlint ; the sha256 is the linux_amd64 line of its
        # actionlint_1.7.12_checksums.txt release asset (checked 2026-11-25). Bump both together.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint periodic-report workflows
        run: actionlint .github/workflows/code-quality-report.yml .github/workflows/task-quality-report.yml
      - run: uv run python -I -m pytest -q

  quality:
    # workflow_dispatch has no diff to measure, so only PRs and pushes are measured.
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
    with:
      python-version: "3.12"
      fail-on: q1
      # this repo measures itself with the version under test (same-repo PRs and pushes; a fork PR falls back to main because a fork SHA may not be fetchable)
      qmetrics-ref: ${{ github.event_name == 'push' && github.sha || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || 'main') }}
