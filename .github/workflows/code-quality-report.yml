# Reusable workflow: whole-repo code metrics (qmetrics repo) as one artifact per run. Inputs and artifact layout: docs/periodic.md.
# Report only: values never fail the job. Tool errors (qmetrics, mcq-report, pip, checkout, upload) do.
# Every third-party action is pinned to a full commit SHA; the version is in the comment after it.
name: code-quality-report

on:
  workflow_call:
    inputs:
      qmetrics-ref:
        description: >-
          Git tag or full commit SHA of FATESAIKOU/MyCodeQuality to install. Required, with no default,
          so the numbers cannot drift when main moves.
        type: string
        required: true
      python-version:
        description: Python minor version. The AST-based metrics can differ across versions.
        type: string
        default: "3.12"
      src:
        description: Source directory to measure.
        type: string
        default: src
      tests:
        description: Test directory.
        type: string
        default: tests
      target:
        description: Name of the measured package, for example one per package in a multi-package repo. Only [A-Za-z0-9._-] (it goes into the artifact name).
        type: string
        default: main
      rev:
        description: Commit to measure. Empty means the caller's github.sha.
        type: string
        default: ""
      retention-days:
        description: Days to keep the artifact (public repos are capped at 90).
        type: number
        default: 90
    outputs:
      artifact-name:
        description: Name of the artifact this run uploaded.
        value: ${{ jobs.code.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.rev != '' && inputs.rev || github.sha }}
          fetch-depth: 1  # qmetrics repo runs on a shallow clone
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install qmetrics and mcq-report
        env:
          QMETRICS_REF: ${{ inputs.qmetrics-ref }}
        run: |
          set -euo pipefail
          python -m pip install "git+https://github.com/FATESAIKOU/MyCodeQuality.git@${QMETRICS_REF}"

      - name: Resolve revision and artifact name
        id: name
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD)"
          committed_epoch="$(git show -s --format=%ct "$rev")"
          committed_at="$(date -u -d "@${committed_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          name="$(mcq-report name code --repo "$GITHUB_REPOSITORY" --target "$TARGET" --committed-at "$committed_at" --rev "$rev")"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Measure (report only)
        env:
          REV: ${{ steps.name.outputs.rev }}
          SRC: ${{ inputs.src }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mcq-out"
          mkdir -p "$out"
          qmetrics repo --rev "$REV" --src "$SRC" --tests "$TESTS" --json > "$out/qmetrics-repo.json"
          qmetrics repo --rev "$REV" --src "$SRC" --tests "$TESTS" > "$RUNNER_TEMP/qmetrics-repo.txt"
          {
            echo "### qmetrics repo (report only)"
            echo '```'
            cat "$RUNNER_TEMP/qmetrics-repo.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Index
        env:
          QMETRICS_REF: ${{ inputs.qmetrics-ref }}
          PY_VERSION: ${{ inputs.python-version }}
          TARGET: ${{ inputs.target }}
          REV: ${{ steps.name.outputs.rev }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mcq-out"
          mcq-report index --report code --repo "$GITHUB_REPOSITORY" --qmetrics-ref "$QMETRICS_REF" \
            --python-version "$PY_VERSION" --rev "$REV" --target "$TARGET" \
            --file "$out/qmetrics-repo.json" --out "$out/index.json"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/mcq-out
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          # Re-run all jobs uploads the same name again; overwrite replaces the old artifact instead of failing.
          overwrite: true
