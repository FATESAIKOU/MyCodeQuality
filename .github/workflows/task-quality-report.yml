# Reusable workflow: task quality per ticket. Inputs and artifact layout: docs/periodic.md. Two jobs:
#   select: mcq-report select picks the tickets for this run (pure function of gh's JSON);
#   ticket: one matrix job per ticket, each its own artifact. max-parallel 1, one job per ticket at a time.
# Report only: values never fail the job. Tool errors (taskquality, mcq-report, gh, pip, checkout, upload) do.
# Every third-party action is pinned to a full commit SHA; the version is in the comment after it.
name: task-quality-report

on:
  workflow_call:
    inputs:
      qmetrics-ref:
        description: >-
          Git tag or full commit SHA of FATESAIKOU/MyCodeQuality to install. Required, with no default,
          so the numbers cannot drift when main moves.
        type: string
        required: true
      python-version:
        description: Python minor version.
        type: string
        default: "3.12"
      tickets:
        description: Space-separated issue numbers. Only used on workflow_dispatch (digits only).
        type: string
        default: ""
      config:
        description: Path of the taskquality config in the caller's repo. Empty means the built-in config.
        type: string
        default: ""
      backfill-days:
        description: On schedule, look back this many days for closed tickets that have no final result yet.
        type: number
        default: 7
      settle-days:
        description: Days after closedAt before a result counts as final (artifact name only).
        type: number
        default: 2
      max-tickets:
        description: Upper bound on tickets per scheduled run (API budget). At most 256.
        type: number
        default: 20
      retention-days:
        description: Days to keep each artifact (public repos are capped at 90).
        type: number
        default: 90
      runs-on:
        description: >-
          One runner label, or a JSON array string such as ["self-hosted","linux"] for several labels.
          Used by the select and ticket jobs.
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  select:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    outputs:
      tickets: ${{ steps.select.outputs.tickets }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install qmetrics and mcq-report
        env:
          QMETRICS_REF: ${{ inputs.qmetrics-ref }}
        run: |
          set -euo pipefail
          python -m pip install "git+https://github.com/FATESAIKOU/MyCodeQuality.git@${QMETRICS_REF}"

      - name: Select tickets
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TICKETS: ${{ inputs.tickets }}
          BACKFILL_DAYS: ${{ inputs.backfill-days }}
          MAX_TICKETS: ${{ inputs.max-tickets }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcq-select"
          mkdir -p "$work"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          args=(--event "$EVENT_NAME" --repo "$GITHUB_REPOSITORY" --now "$now"
            --backfill-days "$BACKFILL_DAYS" --max-tickets "$MAX_TICKETS" --summary "$work/summary.md")
          case "$EVENT_NAME" in
            schedule)
              since="$(date -u -d "${BACKFILL_DAYS} days ago" +%Y-%m-%d)"
              gh issue list -R "$GITHUB_REPOSITORY" --state closed --search "closed:>=${since}" \
                --json number,closedAt,stateReason --limit 1000 > "$work/issues.json"
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$work/artifacts.json"
              args+=(--gh-issues "$work/issues.json" --gh-artifacts "$work/artifacts.json")
              ;;
            issues)
              gh issue view "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --json number,closedAt,stateReason > "$work/issues.json"
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$work/artifacts.json"
              args+=(--gh-issues "$work/issues.json" --gh-artifacts "$work/artifacts.json")
              ;;
            workflow_dispatch)
              args+=(--tickets "$TICKETS")
              ;;
            *)
              echo "unsupported event: $EVENT_NAME (use issues, schedule, or workflow_dispatch)" >&2
              exit 2
              ;;
          esac
          mcq-report select "${args[@]}" > "$work/select.json"
          cat "$work/summary.md"  # ::warning:: lines become annotations when printed here
          cat "$work/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "tickets=$(jq -c '.tickets' "$work/select.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.tickets | length' "$work/select.json")" >> "$GITHUB_OUTPUT"

  ticket:
    needs: select
    # An empty matrix is an error in Actions, so skip the job when select found nothing.
    if: needs.select.outputs.count != '0'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1  # one ticket at a time, so the matrix does not compete for API quota
      matrix:
        ticket: ${{ fromJSON(needs.select.outputs.tickets) }}
    # Same ticket never runs twice at once (one pending run per group; the output is deterministic).
    concurrency:
      group: mcq-task-${{ github.repository }}-${{ matrix.ticket }}
      cancel-in-progress: false
    steps:
      # A ticket that is not closed as completed (open, reopened, not_planned) is skipped with a warning.
      # This is not a tool error, so the job succeeds. The steps after it check closed == 'true' and success().
      - name: Check closed
        id: closed
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ matrix.ticket }}
        run: |
          set -euo pipefail
          issue="$(gh issue view "$TICKET" -R "$GITHUB_REPOSITORY" --json closedAt,stateReason)"
          closed_at="$(jq -r '.closedAt // ""' <<< "$issue")"
          state="$(jq -r '.stateReason // ""' <<< "$issue")"
          if [ -z "$closed_at" ] || [ "$state" != "COMPLETED" ]; then
            echo "::warning::ticket #${TICKET} is not closed as completed (closedAt='${closed_at}', stateReason='${state}'); skipped"
            echo "closed=false" >> "$GITHUB_OUTPUT"
          else
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "closed_at=$closed_at" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout config
        if: ${{ success() && steps.closed.outputs.closed == 'true' && inputs.config != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Non-cone mode with a leading slash checks out exactly this file (cone mode also brings root files and siblings).
          sparse-checkout: /${{ inputs.config }}
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install qmetrics and mcq-report
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        env:
          QMETRICS_REF: ${{ inputs.qmetrics-ref }}
        run: |
          set -euo pipefail
          python -m pip install "git+https://github.com/FATESAIKOU/MyCodeQuality.git@${QMETRICS_REF}"

      - name: Fetch snapshot
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ matrix.ticket }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcq-task"
          mkdir -p "$work"
          taskquality fetch --ticket "${GITHUB_REPOSITORY}#${TICKET}" --search-repo "$GITHUB_REPOSITORY" \
            --out "$work/taskquality-snapshot.json"

      - name: Score and copy config
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcq-task"
          if [ -n "$CONFIG" ]; then
            # The config must be a path inside the caller's repo; the artifact is public, so no absolute or ../ paths.
            case "$CONFIG" in
              /*|..|../*|*/..|*/../*) echo "config must be a repo-relative path: $CONFIG" >&2; exit 2 ;;
            esac
            cp "$CONFIG" "$work/taskquality-config.json"
            taskquality score --snapshot "$work/taskquality-snapshot.json" --config "$CONFIG" --json > "$work/taskquality-report.json"
          else
            taskquality defaults > "$work/taskquality-config.json"
            taskquality score --snapshot "$work/taskquality-snapshot.json" --json > "$work/taskquality-report.json"
          fi

      - name: Name
        id: name
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        env:
          TICKET: ${{ matrix.ticket }}
          CLOSED_AT: ${{ steps.closed.outputs.closed_at }}
          SETTLE_DAYS: ${{ inputs.settle-days }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcq-task"
          closed_at="$CLOSED_AT"
          run_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="$(mcq-report name task --ticket "${GITHUB_REPOSITORY}#${TICKET}" --closed-at "$closed_at" --run-at "$run_at" \
            --report "$work/taskquality-report.json" --snapshot "$work/taskquality-snapshot.json" --settle-days "$SETTLE_DAYS")"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Index
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        env:
          QMETRICS_REF: ${{ inputs.qmetrics-ref }}
          PY_VERSION: ${{ inputs.python-version }}
          TICKET: ${{ matrix.ticket }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcq-task"
          mcq-report index --report task --repo "$GITHUB_REPOSITORY" --qmetrics-ref "$QMETRICS_REF" \
            --python-version "$PY_VERSION" --ticket "${GITHUB_REPOSITORY}#${TICKET}" --search-repo "$GITHUB_REPOSITORY" \
            --file "$work/taskquality-snapshot.json" --file "$work/taskquality-report.json" --file "$work/taskquality-config.json" \
            --out "$work/index.json"

      - name: Upload artifact
        if: ${{ success() && steps.closed.outputs.closed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/mcq-task
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          # Re-run all jobs uploads the same name again; overwrite replaces the old artifact instead of failing.
          overwrite: true
